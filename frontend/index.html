<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── Primary meta ─────────────────────────────────────────────── -->
    <title>EOF Digital Library</title>
    <meta name="description" content="Your gateway to knowledge, culture, and community. Explore curated books, courses, and exclusive EOF Originals."/>
    <meta name="keywords"    content="books, library, ebooks, audiobooks, Black literature, education, courses, EOF"/>
    <meta name="author"      content="EOF Digital Library"/>
    <meta name="theme-color" content="#D4AF37"/>
    <meta name="color-scheme" content="dark"/>

    <!-- ── PWA / installable ────────────────────────────────────────── -->
    <link rel="manifest" href="/manifest.json"/>
    <meta name="mobile-web-app-capable"       content="yes"/>
    <meta name="application-name"             content="EOF Library"/>

    <!-- ── iOS App Store meta ───────────────────────────────────────── -->
    <meta name="apple-mobile-web-app-capable"              content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style"     content="black-translucent"/>
    <meta name="apple-mobile-web-app-title"                content="EOF Library"/>
    <meta name="apple-touch-fullscreen"                    content="yes"/>

    <!-- iOS icons (all required sizes) -->
    <link rel="apple-touch-icon"                            href="/icons/icon-180.png"/>
    <link rel="apple-touch-icon" sizes="120x120"            href="/icons/icon-120.png"/>
    <link rel="apple-touch-icon" sizes="152x152"            href="/icons/icon-152.png"/>
    <link rel="apple-touch-icon" sizes="167x167"            href="/icons/icon-167.png"/>
    <link rel="apple-touch-icon" sizes="180x180"            href="/icons/icon-180.png"/>

    <!-- iOS Splash screens (iPhone / iPad) -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1290x2796.png"/>
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1179x2556.png"/>
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1170x2532.png"/>
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/splash/splash-1125x2436.png"/>
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" href="/splash/splash-828x1792.png"/>

    <!-- ── Android / Chrome meta ────────────────────────────────────── -->
    <meta name="msapplication-TileColor"   content="#0D0D0D"/>
    <meta name="msapplication-TileImage"   content="/icons/icon-144.png"/>
    <meta name="msapplication-config"      content="/browserconfig.xml"/>

    <!-- ── Open Graph (social preview) ─────────────────────────────── -->
    <meta property="og:type"        content="website"/>
    <meta property="og:site_name"   content="EOF Digital Library"/>
    <meta property="og:title"       content="EOF Digital Library"/>
    <meta property="og:description" content="Your gateway to knowledge, culture, and community."/>
    <meta property="og:image"       content="/icons/icon-1024.png"/>
    <meta property="og:image:width"  content="1024"/>
    <meta property="og:image:height" content="1024"/>
    <meta property="og:url"         content="https://eof-digital-library.vercel.app"/>

    <!-- ── Twitter / X card ─────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary"/>
    <meta name="twitter:title"       content="EOF Digital Library"/>
    <meta name="twitter:description" content="Your gateway to knowledge, culture, and community."/>
    <meta name="twitter:image"       content="/icons/icon-512.png"/>

    <!-- ── Favicons ─────────────────────────────────────────────────── -->
    <link rel="icon"             type="image/svg+xml" href="/favicon.svg"/>
    <link rel="icon"             type="image/png" sizes="32x32"  href="/icons/icon-32.png"/>
    <link rel="icon"             type="image/png" sizes="16x16"  href="/icons/icon-16.png"/>
    <link rel="shortcut icon"    href="/icons/icon-48.png"/>

    <!-- ── Fonts ─────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
