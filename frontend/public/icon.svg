<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%"   stop-color="#1C1208"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#E8C558"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8892A"/>
    </linearGradient>

    <!-- Gold shimmer for book pages -->
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A8892A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8892A"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="crimsonGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedRect">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- ── Background ──────────────────────────────────────────────────── -->
  <g clip-path="url(#roundedRect)">
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- Subtle ambient light from top -->
    <ellipse cx="512" cy="0" rx="500" ry="280" fill="#D4AF37" opacity="0.04"/>

    <!-- ── Open book illustration ──────────────────────────────────────── -->
    <!-- Book shadow -->
    <ellipse cx="512" cy="820" rx="310" ry="28" fill="#000" opacity="0.55"/>

    <!-- Book spine / center -->
    <rect x="500" y="310" width="24" height="440" rx="4" fill="#A8892A" opacity="0.9"/>

    <!-- Left page -->
    <path d="M500 330 Q370 340 260 380 L260 730 Q370 695 500 740 Z"
          fill="url(#pageLeft)" opacity="0.92"/>
    <!-- Left page lines (text) -->
    <line x1="290" y1="430" x2="470" y2="415" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="290" y1="460" x2="470" y2="447" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="290" y1="490" x2="460" y2="479" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="290" y1="520" x2="465" y2="510" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="290" y1="550" x2="455" y2="542" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="290" y1="580" x2="462" y2="574" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="290" y1="610" x2="458" y2="605" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="290" y1="640" x2="450" y2="637" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>

    <!-- Right page -->
    <path d="M524 330 Q654 340 764 380 L764 730 Q654 695 524 740 Z"
          fill="url(#pageRight)" opacity="0.92"/>
    <!-- Right page lines -->
    <line x1="554" y1="415" x2="734" y2="430" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="554" y1="447" x2="734" y2="460" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="564" y1="479" x2="734" y2="490" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="559" y1="510" x2="734" y2="520" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="569" y1="542" x2="734" y2="550" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="562" y1="574" x2="734" y2="580" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="566" y1="605" x2="734" y2="610" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>
    <line x1="574" y1="637" x2="734" y2="640" stroke="#0D0D0D" stroke-width="7" stroke-linecap="round" opacity="0.18"/>

    <!-- Book cover bottom curve -->
    <path d="M260 730 Q370 695 500 740 L524 740 Q654 695 764 730 L764 760 Q512 800 260 760 Z"
          fill="#8B6914" opacity="0.7"/>

    <!-- ── "EOF" wordmark ────────────────────────────────────────────── -->
    <!-- Glow backdrop for text -->
    <ellipse cx="512" cy="220" rx="280" ry="90" fill="#D4AF37" opacity="0.06" filter="url(#softGlow)"/>

    <!-- EOF text -->
    <text
      x="512" y="272"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="200"
      font-weight="700"
      letter-spacing="12"
      fill="url(#goldGrad)"
      filter="url(#goldGlow)"
    >EOF</text>

    <!-- ── Crimson accent ────────────────────────────────────────────── -->
    <!-- Three crimson dots under the wordmark -->
    <circle cx="472" cy="302" r="10" fill="#C0392B" filter="url(#crimsonGlow)"/>
    <circle cx="512" cy="302" r="10" fill="#E74C3C" filter="url(#crimsonGlow)"/>
    <circle cx="552" cy="302" r="10" fill="#C0392B" filter="url(#crimsonGlow)"/>

    <!-- Bottom tagline (visible at large sizes) -->
    <text
      x="512" y="910"
      text-anchor="middle"
      font-family="Georgia, serif"
      font-size="44"
      font-weight="400"
      letter-spacing="8"
      fill="#D4AF37"
      opacity="0.55"
    >DIGITAL LIBRARY</text>

    <!-- Subtle gold border inner glow -->
    <rect width="1024" height="1024" rx="224" ry="224"
          fill="none" stroke="#D4AF37" stroke-width="6" opacity="0.12"/>
    <rect x="16" y="16" width="992" height="992" rx="208" ry="208"
          fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.07"/>
  </g>
</svg>
